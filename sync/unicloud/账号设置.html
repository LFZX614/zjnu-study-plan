<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设置学习同步账号</title><style>body{max-width:580px;margin:40px auto;padding:24px;font:17px/1.8 system-ui;background:#f5f7f3;color:#24332c}label{display:block;margin:20px 0}input,button{box-sizing:border-box;width:100%;padding:14px;font:inherit;border:1px solid #c5d1c6;border-radius:9px}button{background:#37745b;color:white;cursor:pointer}small{color:#58675d}#message{white-space:pre-wrap}</style><h1>设置你的学习账号</h1><p>以后在手机和电脑上，都用这里设置的账号、密码登录学习网站。</p><p><small>这是学习网站自己的账号，可以和 DCloud 账号不同。页面只在本机计算，不联网，也不会把你的密码保存到文件或发到聊天。</small></p><form><label>学习账号<input name="username" value="study" required minlength="3" maxlength="80" autocomplete="username"></label><label>学习密码（至少12个字符）<input name="password" type="password" required minlength="12" maxlength="256" autocomplete="new-password"></label><label>再输入一次密码<input name="confirmation" type="password" required minlength="12" maxlength="256" autocomplete="new-password"></label><button>确认并保存配置文件</button></form><p id="message" role="status"></p><small>文件名为 study-sync-env.json，只含账号和用于验证密码的加密结果。保存到电脑即可，不用上传到聊天。请记住你刚设置的账号和密码。</small><script>
document.querySelector('form').onsubmit=async e=>{
 e.preventDefault();const f=new FormData(e.target),msg=document.querySelector('#message'),button=e.target.querySelector('button');
 if(f.get('password')!==f.get('confirmation')){msg.textContent='两次密码不一致，请重新输入。';return}
 button.disabled=true;msg.textContent='正在生成配置，请稍候…';
 try{
  const salt=crypto.getRandomValues(new Uint8Array(16)),hex=b=>Array.from(new Uint8Array(b),n=>n.toString(16).padStart(2,'0')).join('');
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(f.get('password')),'PBKDF2',false,['deriveBits']);
  const hash=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},key,256);
  const result={format:'study-sync-config-v1',username:f.get('username'),salt:hex(salt),hash:hex(hash)};
  const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download='study-sync-env.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);
  msg.textContent='配置文件已生成，请保存到电脑。\n完成后回到聊天告诉我“账号设置好了”即可，不用发密码。';
  e.target.password.value='';e.target.confirmation.value='';
 }catch{msg.textContent='当前浏览器未能完成计算。请使用最新版 Chrome 或 Edge 打开这个本地页面。'}
 finally{button.disabled=false}
};
</script></html>
